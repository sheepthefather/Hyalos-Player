# Daemon heap.
#
# Not optional. Without this file Gradle falls back to a 512 MiB heap, and the
# first `assembleDebug` dies in `compileDebugKotlin` with "the JVM garbage
# collector is thrashing" — AGP 9 compiles Kotlin in-process and the Compose
# compiler plugin on top of it does not fit. The Kotlin daemon inherits these
# arguments too.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8

org.gradle.parallel=true
org.gradle.caching=true
