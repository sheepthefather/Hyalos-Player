[versions]
# Toolchain. AGP 9 compiles Kotlin itself — see the note on plugins below.
agp = "9.4.1"
kotlin = "2.4.20"

# Android
#
# `compileSdk` must be at least 37: the Compose BOM this project uses pulls in
# androidx artifacts compiled against API 37, and AGP refuses to build when a
# dependency was compiled against a newer API than the app. It is independent of
# `targetSdk`, which is what opts the app into new runtime behaviour, so
# compiling against 37 does not change how the app behaves on older devices.
compileSdk = "37"
minSdk = "29"
targetSdk = "36"

# Compose. The BOM pins every androidx.compose.* artifact to a mutually tested
# set, so the individual libraries below carry no version of their own.
composeBom = "2026.09.00"
activityCompose = "1.13.0"

# The playback engine (Apache-2.0). Its DataSource contract is what Krystallos'
# read_at shape was designed against.
media3 = "1.11.1"

# Navigation 3: the back stack is a plain list the app owns, and each entry gets
# its own ViewModelStore through lifecycle-viewmodel-navigation3.
navigation3 = "1.2.0"
lifecycle = "2.11.0"

datastore = "1.2.1"

# Encrypts stored passwords with a key held in the Android Keystore. The
# official replacement for the deprecated androidx EncryptedSharedPreferences.
tink = "1.23.0"

kotlinxSerialization = "1.11.0"

# The generated UniFFI bindings import kotlinx.coroutines for `suspend fun`, so
# this is a real dependency, not one to leave to whatever Compose pulls in.
coroutines = "1.11.0"

# JNA must be the `aar` variant, not the jar. See app/build.gradle.kts.
jna = "5.19.1"

# Tests
junit = "4.13.2"
androidxTestRunner = "1.7.0"
androidxTestExtJunit = "1.3.0"
# DataSourceContractTest mocks a TransferListener, and on a device Mockito can
# only do that with the Android mock maker. Not the 3.12.4 that
# media3-test-utils brings in: that one writes the generated classes to a
# writable dex file, which Android 14+ refuses to load. 5.x (newer ByteBuddy)
# does not, and Gradle raises mockito-core to match.
mockito = "5.24.0"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
compose-ui = { group = "androidx.compose.ui", name = "ui" }
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
compose-material3 = { group = "androidx.compose.material3", name = "material3" }

androidx-navigation3-runtime = { group = "androidx.navigation3", name = "navigation3-runtime", version.ref = "navigation3" }
androidx-navigation3-ui = { group = "androidx.navigation3", name = "navigation3-ui", version.ref = "navigation3" }
androidx-lifecycle-viewmodel-navigation3 = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-navigation3", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-datastore = { group = "androidx.datastore", name = "datastore", version.ref = "datastore" }

media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
# PlayerView rather than the Compose `Player` from media3-ui-compose-material3:
# in 1.11 the latter is still @ExperimentalApi and has no auto-hiding controls,
# buffering indicator or audio-track selection. See ARCHITECTURE.md.
media3-ui = { group = "androidx.media3", name = "media3-ui", version.ref = "media3" }
# Not used yet — background playback is out of scope for now. Kept so the
# version is recorded alongside the rest of Media3.
media3-session = { group = "androidx.media3", name = "media3-session", version.ref = "media3" }
media3-test-utils = { group = "androidx.media3", name = "media3-test-utils", version.ref = "media3" }

tink-android = { group = "com.google.crypto.tink", name = "tink-android", version.ref = "tink" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }

# The generated UniFFI bindings load the Rust library through JNA's direct
# mapping, so this is not optional.
jna = { group = "net.java.dev.jna", name = "jna", version.ref = "jna" }

junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "androidxTestRunner" }
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "androidxTestExtJunit" }
mockito-android = { group = "org.mockito", name = "mockito-android", version.ref = "mockito" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }

# No `org.jetbrains.kotlin.android` entry, deliberately.
#
# AGP 9 has built-in Kotlin support and enables it by default, and the
# standalone Kotlin Android plugin is *incompatible* with the new DSL — applying
# it fails the build outright. Kotlin compilation is part of AGP now, so a
# normal Android module applies only the Android plugin.
#
# The Compose compiler plugin is still separate: it is a Kotlin compiler plugin,
# not the Kotlin build integration.
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
# Same kind of plugin as the Compose one — a compiler plugin, not the Kotlin
# build integration — so it coexists with AGP 9's built-in Kotlin.
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
